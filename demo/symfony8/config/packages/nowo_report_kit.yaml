# S2: the report pages with two demo types (App\Report\*), the demo scope resolver and access checker, every format.
nowo_report_kit:
    enabled: true
    owner:
        id_field: userIdentifier
    scope:
        resolver: App\Report\DemoScopeResolver
        access_checker: App\Report\DemoAccessChecker
    types:
        order: [signups, orders_by_status]
    filename_prefix: demo-report
    web_ui:
        enabled: true
        path_prefix: /reports
