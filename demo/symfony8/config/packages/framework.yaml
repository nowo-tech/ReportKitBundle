framework:
  secret: '%env(APP_SECRET)%'
  http_method_override: false
  handle_all_throwables: true
  session: true
  default_locale: en
  translator:
    default_path: '%kernel.project_dir%/translations'
    fallbacks: ['en']
  assets: ~
  # S3: scheduled report mails go to Mailpit (demo only, no credential).
  mailer:
    dsn: '%env(MAILER_DSN)%'
  php_errors:
    log: true

when@test:
  framework:
    test: true
